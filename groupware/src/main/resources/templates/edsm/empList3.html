<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>수신자 선택창</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/jquery-3.6.0.min.js"></script>
        <script src="/js/script.js"></script>
    </head>
	<style>
        .org_tree ul {
            padding-left: 20px;
            list-style: none;
            position: relative;
        }

        .org_tree ul::before {
            content: '';
            border-left: 1px solid #ccc;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 10px;
        }

        .org_tree li {
            margin: 0;
            padding: 10px 0 0 20px;
            position: relative;
        }

        .org_tree li::before {
            content: '';
            border-top: 1px solid #ccc;
            position: absolute;
            top: 15px;
            left: 0;
            width: 10px;
            height: 0;
        }

        .employees {
            margin-left: 20px;
        }
    </style>

    <body>
        <!-- header 시작 -->
        <header th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <aside th:insert="fragments/nav"></aside>
            <!-- nav 종료 -->

            <section class="contents">
				<h3 class="tit_h3">조직도</h3>
				
					<div class="org_tree">
						<ul>
							<!-- 개발부 -->
							<li>
								<label><input type="checkbox" name="department" value="dev"> <strong>개발부</strong></label>
								<ul class="employees">
									<li><label><input type="checkbox" name="employee" value="홍길동"> 팀장: 홍길동</label></li>
									<li><label><input type="checkbox" name="employee" value="김개발"> 과장: 김개발</label></li>
									<li><label><input type="checkbox" name="employee" value="이코드"> 대리: 이코드</label></li>
									<li><label><input type="checkbox" name="employee" value="박테스트"> 사원: 박테스트</label></li>
								</ul>
							</li>
							
							<!-- 인사부 -->
							<li>
								<label><input type="checkbox" name="department" value="hr"> <strong>인사부</strong></label>
								<ul class="employees">
									<li><label><input type="checkbox" name="employee" value="최인사"> 팀장: 최인사</label></li>
									<li><label><input type="checkbox" name="employee" value="윤채용"> 과장: 윤채용</label></li>
									<li><label><input type="checkbox" name="employee" value="정복지"> 대리: 정복지</label></li>
									<li><label><input type="checkbox" name="employee" value="오인턴"> 사원: 오인턴</label></li>
								</ul>
							</li>
							
							<!-- 홍보부 -->
							<li>
								<label><input type="checkbox" name="department" value="pr"> <strong>홍보부</strong></label>
								<ul class="employees">
									<li><label><input type="checkbox" name="employee" value="장홍보"> 팀장: 장홍보</label></li>
									<li><label><input type="checkbox" name="employee" value="백마케팅"> 과장: 백마케팅</label></li>
									<li><label><input type="checkbox" name="employee" value="심콘텐츠"> 대리: 심콘텐츠</label></li>
									<li><label><input type="checkbox" name="employee" value="조신입"> 사원: 조신입</label></li>
								</ul>
							</li>
						</ul>
					</div>
		            <div class="btn_frame2">
						<button type="button" class="button1">추가</button>
						<button type="button" class="button2">닫기</button>
	                </div>
	        </section>
        </div>
    </body>
</html>

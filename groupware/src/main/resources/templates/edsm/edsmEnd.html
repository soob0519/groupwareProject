<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>결재 완료 상세페이지</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/jquery-3.6.0.min.js"></script>
        <script src="/js/script.js"></script>
    </head>

    <body>
        <!-- header 시작 -->
        <header th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <aside th:insert="fragments/nav"></aside>
            <!-- nav 종료 -->

            <section class="contents">
                <form id="frm" name="frm">
                    <div class="upload-wrapper">
                        <h3 class="tit_h3">결재완료</h3>

                        <table>
                            <tr class="form-row">
                                <th>휴가일자</th>
                                <td>
									<div class="flex_between">
										<input type="date" value="2025-08-18" /> &nbsp;&nbsp;&nbsp; <input type="date" value="2025-08-30" />
									</div>
								</td>
                            </tr>
                            <tr class="form-row">
                                <th>제목</th>
                                <td><input type="text" value="여름 휴가 신청" /></td>
                            </tr>
                            <tr class="form-row">
								<th>결재자</th>
								<td class="flex_between">
									<div id="approverList" >
										<div class="flex_between">
											<input type="text" name="approvers" value="대리" />&nbsp;
											<input type="text" name="approvers" value="승인" />
										</div>
										<div class="flex_between">
											<input type="text" name="approvers" value="과장" />&nbsp;
											<input type="text" name="approvers" value="승인" />
										</div>
										<div class="flex_between">
											<input type="text" name="approvers" value="팀장" />&nbsp;
											<input type="text" name="approvers" value="승인" />
										</div>
									</div>
								</td>
							</tr>
                            <tr class="form-row">
                                <th>수신자</th>
                                <td><input type="text" value="개발부" /></td>
                            </tr>
                            <tr class="form-row">
                                <th>공유자</th>
                                <td><input type="text" value="인사부 개발부" /></td>
                            </tr>
							<tr class="form-row">
                                <th>첨부문서</th>
                                <td>
									<div class="flex_between">
										<input type="text" value="" />
									</div>
								</td>
								
                            </tr>
                            <tr class="form-row">
                                <th>기안내용</th>
                                <td><textarea> 위 기간동안 여름휴가를 신청합니다. </textarea></td>
                            </tr>
                        </table>

                        <div class="btn_frame2">
                            <button type="button" class="button2">닫기</button>
                        </div>
                            
                    </div>
                </form>

            </section>
        </div>
    </body>
</html>

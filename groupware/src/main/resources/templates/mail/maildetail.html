<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<title>수신메일함</title>
		<link rel="stylesheet" href="/css/style.css">
		<script src="/js/jquery-3.6.0.min.js"></script>
		<script src="/js/script.js"></script>
	</head>
	<script>
    function deleteMail(mailno) {
        if (!confirm("정말 삭제하시겠습니까?")) return;

        fetch("/mail/delete", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "mailno=" + mailno
        })
        .then(response => {
            if (response.ok) {
                alert("삭제 성공!");
                window.location.href = "/mail"; // 리스트로 이동
            } else {
                alert("삭제 실패...");
            }
        })
        .catch(err => {
            alert("에러 발생!");
            console.error(err);
        });
    }
  </script>
	
	<body>
    <!-- header include -->
    <header th:insert="fragments/header"></header>
    <div class="flex_between">
      <!-- nav include -->
      <nav th:insert="fragments/nav"></nav>

      <section class="contents">
        <!-- 메일 내용 영역 -->
        <div class="content">

          <div class="mail_detail">
            <div class="mail_btn_area">
              <!-- 삭제 버튼 -->
              <form th:action="@{/mail/delete}" method="post" style="display: inline;">
                <input type="hidden" name="mailno" th:value="${mail.mailno}" />
                <button type="submit" class="button2">삭제</button>
              </form>

              <!-- 답장 버튼 -->
              <form th:action="@{/mail/reply}" method="get" style="display: inline;">
                <input type="hidden" name="receiverId" th:value="${mail.senderId}" />
                <input type="hidden" name="subject" th:value="'RE: ' + ${mail.subject}" />
                <button type="submit" class="button2">답장</button>
              </form>
            </div>

            <div class="mail_header">
              <h3 class="mail_title">
                <span th:utext="${mail.subject}">제목이 여기에 들어가요~</span>
              </h3>

              <div class="mail_option">
                <div class="sender flex_start">
                  <p class="opt_tit_area">보낸사람</p>
                  <span th:utext="${mail.senderId}" class="opt_area">보낸사람</span>
                </div>
                <div class="option_item flex_start">
                  <p class="opt_tit_area">받은사람</p>
                  <span th:utext="${mail.receiverId}" class="opt_area">받은사람</span>
                </div>
              </div>

              <div class="time_info">
                <span th:text="${mail.sentAt != null ? #temporals.format(mail.sentAt, 'yyyy-MM-dd HH:mm:ss') : '시간 정보 없음'}">보낸시간</span>
              </div>
            </div>

            <div class="mail_body">
              <span class="blind">메일 내용(내용 작성은 아레 P 태그에서.. 이건 설명용..)</span>
              <p th:utext="${#strings.replace(mail.content != null ? mail.content : '', '\n', '<br/>')}">내용용~</p>
            </div>
          </div>

        </div>

      </section>
    </div>
  </body>
</html>

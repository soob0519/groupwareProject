<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>최종 프로젝트</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/jquery-3.6.0.min.js"></script>
        <script src="/js/script.js"></script>

		<style>
			.detail_table th,td {border: 1px solid #d1d1d1;}
            .detail_table th {background: #e9e9e9; padding: 0 20px;}
		</style>

    </head>
    
    <script>$(function() {$("#btn_List").click(function() {location = "/Gnotice/UserList";});});</script>

    <body>
        <!-- header 시작 -->
        <header th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <aside th:insert="fragments/nav"></aside>
            <!-- nav 종료 -->

            <section class="contents">
                <div class="notice_wrapper">
                    <h3 class="tit_h3">일반공지사항</h3> 
                    <div class="content-body">
                        <table class="detail_table">
                            <colgroup>
                                <col width="20%"/>
                                <col width="*"  />
                            </colgroup>
                            <tr>
                                <th style="height:50px;">제목</th>
                                <td th:text="${dto.gntctt}"></td>
                            </tr>
                            <tr>
                                <th style="height:50px;">부서</th>
                                <td th:text="${dto.deptno}"></td>
                            </tr>
                            <tr>
                                <th>내용</th>
                                <td><div class="div_content" th:text="${dto.gntcct}"></div></td>
                            </tr>
                        </table>
                    </div>
                    <!-- button -->
                    <div class="btn_frame3">
                        <button class="button1" id="btn_Mail">매일작성</button>
                        <button class="button2" id="btn_List">목록으로</button>
                    </div>
            </section>
        </div>
    </body>
</html>

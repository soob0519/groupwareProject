<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>최종 프로젝트</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/jquery-3.6.0.min.js"></script>
        <script src="/js/script.js"></script>
    </head>
    
    <script>
    
    	$(function() {
	 		
	 		$("#btn_List"  ).click(function() {location = "/Inotice/AdminList";});
	 		
	 		// 암호입력 스페이스 입력 막기
	 		$("#intcps").on('keydown', function(e) {if (e.key === " " || e.keyCode === 32) e.preventDefault();});
	 		
	 		$("#btn_submit").click(function() {
	 			
	 			if($("#intctt").val().trim() == "") {
	 				alert("제목을 입력하세요.");
	 				$("#intctt").focus();
	 				return false;
	 			}
	 			
	 			if ($("#indept").val() === "") {
	 			    alert("부서를 선택하세요.");
	 			    $("#indept").focus();
	 			    return false;
	 			}
	 			
	 			if (!$("input[name='intcca']:checked").val()) {
	 				alert("유형을 선택하세요.");
	 				return false;
	 			}
	 			
	 			if($("#intcct").val().trim() == "") {
	 				alert("내용을 입력하세요.");
	 				$("#intcct").focus();
	 				return false;
	 			}
	 			
	 			event.preventDefault();  // 기본 폼 제출 막기
	 			let form = $("#frm").serialize(); // serialize() : 폼을 인식하는 함수
	 			//ajax : {비동기}전송
	 			$.ajax({
	 				type	 : "post",	//전송타입
	 				url		 : "/Inotice", //전송장소
	 				data     : form,   //전송데이터
	 				dataType : "text", //받는 데이터 타입
	 				success  : function(data) { // data변수 : 실제 받은 데이터 값
	 					if(data == "ok") { 		// data변수 값이 "ok" 라면 저장 성공으로 판단함
	 						alert("등록완료!");
	 						location = "/Inotice/AdminList";
	 					}
	 					else 			   alert("등록실패!");
	 				},
	 				error	 : function() {alert("오류발생!");}
	 			});
	 		});
	 	});
	 	
 	</script>

    <body>
        <!-- header 시작 -->
        <header th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <aside th:insert="fragments/nav"></aside>
            <!-- nav 종료 -->

            <section class="contents">
                <div class="notice_wrapper">
                    <h3 class="tit_h3">전체공지사항</h3>
                    <form id="frm" enctype="multipart/form-data">
                        <div class="content-body" align="center">
                            <table class="write_table">
                                <tr class="form-row">
                                    <th>제목</th>
                                    <td><input type="text" class="input" id="intctt" name="intctt"></td>
                                </tr>
                                <tr class="form-row">
                                    <th>부서</th>
                                    <td>
                                        <select id="deptno" name="deptno" class="select1">
                                            <option value="">부서</option>
                                            <option value="전체부서">전체부서</option>
                                            <option value="인사부">인사부</option>
                                            <option value="개발부">개발부</option>
                                            <option value="영업부">영업부</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr class="form-row">
                                    <th>유형</th>
                                    <td class="flex_start" style="gap: 20px;">
                                        <span><input type="radio" class="radio" id="intcca" name="intcca" value="필수">필수</span>
                                        <span><input type="radio" class="radio" id="intcca" name="intcca" value="일반">일반</span>
                                    </td>
                                </tr>
                                <tr class="form-row">
                                    <th>내용</th>
                                    <td><textarea class="content" id="intcct" name="intcct"></textarea></td>
                                </tr>
                            </table>
                        </div>
                        <!-- button -->
                        <div class="btn_frame3">
                            <button class="button1" type="submit" id="btn_submit">등록하기</button>
                            <button class="button2" type="reset">취소하기</button>
                            <button class="button2" type="button" id="btn_List">목록으로</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </body>
</html>

<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>조직도</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/js/jquery-3.6.0.min.js"></script>
        <script src="/js/script.js"></script>
    </head>
	<style>
	.org_tree ul {
    padding-left: 20px;
    list-style: none;
    position: relative;
	}

	.org_tree ul::before {
		content: '';
		border-left: 1px solid #ccc;
		position: absolute;
		top: 0;
		bottom: 0;
		left: 10px;
	}

	.org_tree li {
		margin: 0;
		padding: 10px 0 0 20px;
		position: relative;
	}

	.org_tree li::before {
		content: '';
		border-top: 1px solid #ccc;
		position: absolute;
		top: 15px;
		left: 0;
		width: 10px;
		height: 0;
	}
	</style>

    <body>
        <!-- header 시작 -->
        <header th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <aside th:insert="fragments/nav"></aside>
            <!-- nav 종료 -->

            <section class="contents">
				<h3 class="tit_h3">조직도</h3>

				<div class="org_tree">
					<ul>
						<li>
							<strong>개발부</strong>
							<ul>
								<li>팀장: 홍길동</li>
								<li>과장: 김개발</li>
								<li>대리: 이코드</li>
								<li>사원: 박테스트</li>
							</ul>
						</li>
						<li>
							<strong>인사부</strong>
							<ul>
								<li>팀장: 최인사</li>
								<li>과장: 윤채용</li>
								<li>대리: 정복지</li>
								<li>사원: 오인턴</li>
							</ul>
						</li>
						<li>
							<strong>홍보부</strong>
							<ul>
								<li>팀장: 장홍보</li>
								<li>과장: 백마케팅</li>
								<li>대리: 심콘텐츠</li>
								<li>사원: 조신입</li>
							</ul>
						</li>
					</ul>
				</div>
			</section>
        </div>
    </body>
</html>

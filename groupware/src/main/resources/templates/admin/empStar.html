<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>사원 목록</title>
        <link rel="stylesheet" href="css/style.css">
		<link rel="stylesheet" href="css/jquery-ui.css">		
        <script src="js/jquery-3.6.0.min.js"></script>
        <script src="js/script.js"></script>
    </head>
	<style>
	.org_tree ul {
    padding-left: 20px;
    list-style: none;
    position: relative;
	}

	.org_tree ul::before {
		content: '';
		border-left: 1px solid #ccc;
		position: absolute;
		top: 0;
		bottom: 0;
		left: 10px;
	}

	.org_tree li {
		margin: 0;
		padding: 10px 0 0 20px;
		position: relative;
	}

	.org_tree li::before {
		content: '';
		border-top: 1px solid #ccc;
		position: absolute;
		top: 15px;
		left: 0;
		width: 10px;
		height: 0;
	}
	</style>
    <body>
        <!-- header 시작 -->
        <header class="header" th:insert="fragments/header"></header>
        <!-- header 종료 -->

        <div class="flex_between">

            <!-- nav 시작 -->
            <header class="aside" th:insert="fragments/nav"></header>
            <!-- nav 종료 -->

            <section class="contents">
				<h3 class="tit_h3">즐겨찾기</h3>

				<div class="org_tree">
					<ul>
						<li>
							<strong>개발부</strong>
							<ul>
								<li>팀장: 홍길동</li>
								<li>과장: 김개발</li>
								<li>대리: 이코드</li>
								<li>사원: 박테스트</li>
							</ul>
						</li>
					</ul>
				</div>
			</section>
        </div>
    </body>
</html>
